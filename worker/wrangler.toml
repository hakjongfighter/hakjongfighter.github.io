name = "hakjongfighter-blog-api"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true
# Cloudflare 화면에서 넣은 변수·비밀값(ADMIN_TOKEN, SALT 등)은 자동 배포 때도 그대로 유지
keep_vars = true

[vars]
ALLOWED_ORIGINS = "https://hakjongfighter.com,https://www.hakjongfighter.com"

# 매일 새벽 3시 17분(한국 시간)에 오래된 기록 정리
[triggers]
crons = ["17 18 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "hakjongfighter-blog"
database_id = "b53a2c7d-8f81-4a20-b8cb-a3988b73a0c6"

# 비밀값 ADMIN_TOKEN, SALT 는 이 파일에 쓰지 말고 Cloudflare 화면(Settings → Variables and Secrets)에서 넣어요.
