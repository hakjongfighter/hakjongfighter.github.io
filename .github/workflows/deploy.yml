# main에 올라오면 사이트를 GitHub Pages로 배포합니다.
# 설정 → Pages → Source를 "GitHub Actions"로 한 번만 바꿔 두면 이후 자동입니다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'   # 1시간마다 방문 현황(stats) 숫자 새로 받기
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: GA4 방문 현황 받기 (stats/data.json)
        env:
          GA_SA_KEY: ${{ secrets.GA_SA_KEY }}
          STATS_PASSWORD: ${{ secrets.STATS_PASSWORD }}
          GA_PROPERTY_ID: '564804538'
        run: |
          if [ -n "$GA_SA_KEY" ]; then pip install -q google-analytics-data==0.20.0 cryptography==44.0.0; fi
          python .github/scripts/fetch_ga.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
