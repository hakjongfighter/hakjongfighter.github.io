# main에 올라오면 사이트를 GitHub Pages로 배포합니다.
# 설정 → Pages → Source를 "GitHub Actions"로 한 번만 바꿔 두면 이후 자동입니다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'   # 1시간마다 방문 현황(stats) 숫자 새로 받기
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: GA4 방문 현황 받기 (stats/data.json)
        env:
          GA_SA_KEY: ${{ secrets.GA_SA_KEY }}
          STATS_PASSWORD: ${{ secrets.STATS_PASSWORD }}
          GA_PROPERTY_ID: '564804538'
        run: |
          if [ -n "$GA_SA_KEY" ]; then pip install -q google-analytics-data==0.20.0 cryptography==44.0.0; fi
          python .github/scripts/fetch_ga.py
      - name: 블로그 페이지 만들기 (blog/posts → blog/)
        env:
          BLOG_API: ${{ vars.BLOG_API }}   # 공감·댓글 서버 주소 (저장소 Settings → Variables에서 설정)
        run: |
          pip install -q markdown==3.7
          python .github/scripts/build_blog.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # GitHub 쪽에서 방금 올린 묶음을 바로 못 찾는 일시 오류가 가끔 있어, 실패하면 30초 뒤 한 번 더 배포
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
