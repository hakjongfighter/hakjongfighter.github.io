# main에 새 커밋이 올라오면 GitHub Pages가 다시 빌드되도록 빈 커밋을 하나 올립니다.
# (Claude 앱 계정으로 push하면 Pages가 자동으로 다시 빌드되지 않는 문제 해결)
name: Rebuild GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger Pages build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Pages 재빌드"
          git push
