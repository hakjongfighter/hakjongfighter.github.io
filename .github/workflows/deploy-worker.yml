# worker/ 폴더가 바뀌어 main에 올라오면 Cloudflare Worker(hakjongfighter-blog-api)를 자동으로 배포합니다.
# 필요한 비밀값: CLOUDFLARE_API_TOKEN (저장소 Settings → Secrets and variables → Actions)
#   Cloudflare 대시보드 → My Profile → API Tokens → Create Token → "Edit Cloudflare Workers" 템플릿으로 발급
# 비밀값이 없으면 배포를 건너뛰고 안내만 남깁니다.
name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: 토큰 확인
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN 비밀값이 없어 Worker 배포를 건너뛰었어요."
            echo "ready=no" >> "$GITHUB_OUTPUT"
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'yes'
        with:
          node-version: '22'
      - name: Worker 배포
        if: steps.check.outputs.ready == 'yes'
        working-directory: worker
        run: npx --yes wrangler@4 deploy
